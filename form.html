<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encuesta corredores</title>
<style>
  :root {
    --color-primary: #4f46e5;
    --color-primary-hover: #4338ca;
    --color-bg-start: #eef2ff;
    --color-bg-end: #e0e7ff;
    --color-card: #ffffff;
    --color-text: #0f172a;
    --color-text-soft: #64748b;
    --color-border: #e2e8f0;
    --color-error: #dc2626;
    --font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    font-family: var(--font-family);
    background: linear-gradient(135deg, var(--color-bg-start), var(--color-bg-end));
    color: var(--color-text);
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  .app {
    width: 100%;
    max-width: 560px;
    background: var(--color-card);
    border-radius: 20px;
    box-shadow: 0 20px 60px -15px rgba(79, 70, 229, 0.25);
    overflow: hidden;
  }
  .progress-track {
    height: 6px;
    background: var(--color-border);
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--color-primary);
    transition: width 0.4s cubic-bezier(0.65, 0, 0.35, 1);
  }
  .step-counter {
    padding: 1rem 2rem 0;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--color-text-soft);
    text-transform: uppercase;
  }
  .steps-viewport {
    overflow: hidden;
    position: relative;
    min-height: 320px;
  }
  .steps-track {
    display: flex;
    transition: transform 0.45s cubic-bezier(0.65, 0, 0.35, 1);
  }
  .step {
    flex: 0 0 auto;
    padding: 1.5rem 2rem 2rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 320px;
  }
  .step label {
    display: block;
    font-size: 1.4rem;
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 1.5rem;
  }
  input[type="text"], input[type="number"] {
    width: 100%;
    padding: 0.8rem 1rem;
    border: 2px solid var(--color-border);
    border-radius: 10px;
    font-size: 1.05rem;
    font-family: inherit;
    transition: border-color 0.2s ease;
  }
  input[type="text"]:focus, input[type="number"]:focus {
    outline: none;
    border-color: var(--color-primary);
  }
  .radio-option {
    display: block;
    margin-bottom: 0.6rem;
  }
  .radio-option input[type="radio"] {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
  }
  .radio-option label {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.85rem 1rem;
    border: 2px solid var(--color-border);
    border-radius: 10px;
    font-size: 1.05rem;
    font-weight: 500;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
  }
  .radio-option label:hover {
    border-color: var(--color-primary);
    background: #f5f3ff;
  }
  .radio-option label::before {
    content: "";
    width: 18px;
    height: 18px;
    flex: 0 0 18px;
    border-radius: 50%;
    border: 2px solid var(--color-border);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .radio-option input[type="radio"]:checked + label {
    border-color: var(--color-primary);
    background: #eef2ff;
  }
  .radio-option input[type="radio"]:checked + label::before {
    border-color: var(--color-primary);
    border-width: 5px;
  }
  .radio-option input[type="radio"]:focus-visible + label {
    outline: 2px solid var(--color-primary);
    outline-offset: 2px;
  }
  .otro-input {
    margin-top: 0.6rem;
  }
  .error {
    color: var(--color-error);
    font-size: 0.85rem;
    margin-top: 0.6rem;
    min-height: 1.1rem;
  }
  .nav-buttons {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 2rem 1.75rem;
  }
  button {
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease, opacity 0.15s ease;
  }
  button:active { transform: scale(0.97); }
  #btn-back {
    background: transparent;
    color: var(--color-text-soft);
    padding: 0.7rem 0.5rem;
  }
  #btn-back:hover { color: var(--color-text); }
  #btn-back:disabled { visibility: hidden; }
  #btn-next, #btn-submit {
    background: var(--color-primary);
    color: white;
    padding: 0.8rem 1.8rem;
    margin-left: auto;
  }
  #btn-next:hover, #btn-submit:hover { background: var(--color-primary-hover); }
  #btn-submit:disabled { background: var(--color-border); cursor: not-allowed; }
  #status {
    padding: 0 2rem 1.5rem;
    font-size: 0.9rem;
    color: var(--color-text-soft);
  }
  #status button {
    background: none;
    color: var(--color-primary);
    text-decoration: underline;
    padding: 0;
    font-size: 0.9rem;
  }
  .final-screen {
    padding: 3rem 2rem;
    text-align: center;
  }
  .final-screen .icon {
    font-size: 3rem;
    margin-bottom: 1rem;
  }
  .final-screen h2 {
    margin: 0 0 0.5rem;
    font-size: 1.5rem;
  }
  .final-screen p {
    color: var(--color-text-soft);
    margin: 0;
  }
  @media (max-width: 480px) {
    .step label { font-size: 1.2rem; }
    .step, .step-counter, .nav-buttons, #status { padding-left: 1.25rem; padding-right: 1.25rem; }
  }
</style>
</head>
<body>
  <div class="app">
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="step-counter" id="step-counter"></div>
    <form id="dynamic-form" novalidate>
      <div class="steps-viewport">
        <div class="steps-track" id="steps-track"></div>
      </div>
      <div class="nav-buttons" id="nav-buttons">
        <button type="button" id="btn-back">← Atrás</button>
        <button type="button" id="btn-next">Siguiente →</button>
        <button type="submit" id="btn-submit" style="display:none">Enviar</button>
      </div>
    </form>
    <div id="status"></div>
  </div>
  <script>
    const CONFIG = {
      WEB_APP_URL: 'https://script.google.com/macros/s/AKfycbysg44T4VjYg4yJLHS8jNAwBfaap668hmNy5_xlxnMAvfJ_3tG0XmcwWUpeEX0lZa7o/exec'
    };
  </script>
  <script>
let QUESTIONS = [];
let currentStep = 0;

async function loadSchema() {
  const statusEl = document.getElementById('status');
  try {
    const res = await fetch(`${CONFIG.WEB_APP_URL}?action=schema`);
    if (!res.ok) throw new Error('bad status ' + res.status);
    const questions = await res.json();
    QUESTIONS = questions;
    renderForm(questions);
  } catch (err) {
    statusEl.textContent = 'No se pudo cargar el formulario, reintentá.';
    statusEl.innerHTML += ' <button type="button" id="retry-load">Reintentar</button>';
    document.getElementById('retry-load').addEventListener('click', loadSchema);
  }
}

function renderForm(questions) {
  const track = document.getElementById('steps-track');
  track.innerHTML = '';
  const n = questions.length;
  track.style.width = `${n * 100}%`;
  questions.forEach((q, i) => {
    const step = renderField(q);
    step.classList.add('step');
    step.dataset.index = i;
    step.style.width = `${100 / n}%`;
    track.appendChild(step);
  });
  currentStep = 0;
  goToStep(0);
  document.getElementById('nav-buttons').style.display = '';
}

function renderField(q) {
  const wrapper = document.createElement('div');
  wrapper.dataset.id = q.id;
  wrapper.dataset.tipo = q.tipo;
  wrapper.dataset.requerido = q.requerido;

  const label = document.createElement('label');
  label.textContent = q.texto;
  wrapper.appendChild(label);

  if (q.tipo === 'number') {
    const [min, max] = q.opciones;
    const input = document.createElement('input');
    input.type = 'number';
    input.name = q.id;
    if (min !== undefined) input.min = min;
    if (max !== undefined) input.max = max;
    wrapper.appendChild(input);
  } else if (q.tipo === 'text') {
    const input = document.createElement('input');
    input.type = 'text';
    input.name = q.id;
    wrapper.appendChild(input);
  } else if (q.tipo === 'select' || q.tipo === 'select_other') {
    q.opciones.forEach(opt => {
      const optWrap = document.createElement('div');
      optWrap.className = 'radio-option';
      const radio = document.createElement('input');
      radio.type = 'radio';
      radio.name = q.id;
      radio.value = opt;
      radio.id = `${q.id}-${opt}`;
      const optLabel = document.createElement('label');
      optLabel.htmlFor = radio.id;
      optLabel.textContent = opt;
      optWrap.appendChild(radio);
      optWrap.appendChild(optLabel);
      wrapper.appendChild(optWrap);
    });
    if (q.tipo === 'select_other') {
      const otherInput = document.createElement('input');
      otherInput.type = 'text';
      otherInput.name = `${q.id}_otro`;
      otherInput.placeholder = 'Especificar';
      otherInput.disabled = true;
      otherInput.className = 'otro-input';
      wrapper.appendChild(otherInput);
      wrapper.addEventListener('change', () => {
        const selected = wrapper.querySelector(`input[name="${q.id}"]:checked`);
        otherInput.disabled = !(selected && selected.value === 'Otra');
        if (!otherInput.disabled) otherInput.focus({ preventScroll: true });
      });
    }
  }

  const errorEl = document.createElement('div');
  errorEl.className = 'error';
  wrapper.appendChild(errorEl);
  return wrapper;
}

function validateStep(index) {
  const field = document.querySelector(`.step[data-index="${index}"]`);
  if (!field) return true;
  const errorEl = field.querySelector('.error');
  errorEl.textContent = '';
  const requerido = field.dataset.requerido === 'true';
  const tipo = field.dataset.tipo;
  const id = field.dataset.id;
  let value = '';
  if (tipo === 'select' || tipo === 'select_other') {
    const checked = field.querySelector(`input[name="${id}"]:checked`);
    value = checked ? checked.value : '';
  } else {
    const input = field.querySelector(`input[name="${id}"]`);
    value = input ? input.value.trim() : '';
  }
  if (requerido && !value) {
    errorEl.textContent = 'Este campo es obligatorio.';
    return false;
  }
  return true;
}

function validateForm() {
  let valid = true;
  for (let i = 0; i < QUESTIONS.length; i++) {
    if (!validateStep(i)) valid = false;
  }
  return valid;
}

function goToStep(index) {
  if (index > currentStep && !validateStep(currentStep)) return;
  if (index < 0 || index >= QUESTIONS.length) return;
  currentStep = index;

  const track = document.getElementById('steps-track');
  track.style.transform = `translateX(-${currentStep * (100 / QUESTIONS.length)}%)`;

  document.getElementById('progress-fill').style.width = `${((currentStep + 1) / QUESTIONS.length) * 100}%`;
  document.getElementById('step-counter').textContent = `Pregunta ${currentStep + 1} de ${QUESTIONS.length}`;
  document.getElementById('btn-back').disabled = currentStep === 0;

  const isLast = currentStep === QUESTIONS.length - 1;
  document.getElementById('btn-next').style.display = isLast ? 'none' : '';
  document.getElementById('btn-submit').style.display = isLast ? '' : 'none';

  const currentInput = document.querySelector(`.step[data-index="${currentStep}"] input`);
  if (currentInput) currentInput.focus({ preventScroll: true });
}

function collectRespuestas() {
  const respuestas = {};
  document.querySelectorAll('.step').forEach(field => {
    const tipo = field.dataset.tipo;
    const id = field.dataset.id;
    if (tipo === 'select' || tipo === 'select_other') {
      const checked = field.querySelector(`input[name="${id}"]:checked`);
      let value = checked ? checked.value : '';
      if (tipo === 'select_other' && value === 'Otra') {
        const otro = field.querySelector(`input[name="${id}_otro"]`);
        value = otro && otro.value.trim() ? otro.value.trim() : 'Otra';
      }
      respuestas[id] = value;
    } else {
      const input = field.querySelector(`input[name="${id}"]`);
      respuestas[id] = input ? input.value.trim() : '';
    }
  });
  return respuestas;
}

async function sendRespuestas(respuestas) {
  const res = await fetch(CONFIG.WEB_APP_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ respuestas })
  });
  if (!res.ok) throw new Error('bad status ' + res.status);
}

const PENDING_KEY = 'form_corredores_pending';

function savePending(respuestas) {
  const pending = JSON.parse(localStorage.getItem(PENDING_KEY) || '[]');
  pending.push(respuestas);
  localStorage.setItem(PENDING_KEY, JSON.stringify(pending));
}

async function flushPending() {
  const pending = JSON.parse(localStorage.getItem(PENDING_KEY) || '[]');
  if (pending.length === 0) return;
  const remaining = [];
  for (const respuestas of pending) {
    try {
      await sendRespuestas(respuestas);
    } catch (err) {
      remaining.push(respuestas);
    }
  }
  localStorage.setItem(PENDING_KEY, JSON.stringify(remaining));
}

function showFinalScreen(message) {
  document.querySelector('.app').innerHTML = `
    <div class="final-screen">
      <div class="icon">🏁</div>
      <h2>¡Gracias!</h2>
      <p>${message}</p>
    </div>`;
}

function handleSubmit(event) {
  event.preventDefault();
  const statusEl = document.getElementById('status');
  if (!validateForm()) {
    for (let i = 0; i < QUESTIONS.length; i++) {
      if (!validateStep(i)) { goToStep(i); break; }
    }
    return;
  }
  const respuestas = collectRespuestas();
  const submitBtn = document.getElementById('btn-submit');
  submitBtn.disabled = true;
  statusEl.textContent = 'Enviando...';
  sendRespuestas(respuestas)
    .then(() => {
      showFinalScreen('Tu respuesta fue registrada.');
    })
    .catch(() => {
      savePending(respuestas);
      statusEl.innerHTML = 'No se pudo enviar, se guardó localmente. <button type="button" id="retry-send">Reintentar</button>';
      submitBtn.disabled = false;
      document.getElementById('retry-send').addEventListener('click', () => {
        statusEl.textContent = 'Reintentando...';
        flushPending().then(() => {
          showFinalScreen('Tu respuesta fue registrada.');
        });
      });
    });
}

document.getElementById('dynamic-form').addEventListener('submit', handleSubmit);
document.getElementById('btn-next').addEventListener('click', () => goToStep(currentStep + 1));
document.getElementById('btn-back').addEventListener('click', () => goToStep(currentStep - 1));
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const active = document.activeElement;
  if (active && active.tagName === 'INPUT' && active.type === 'text' && active.classList.contains('otro-input')) {
    e.preventDefault();
  }
  const isLast = currentStep === QUESTIONS.length - 1;
  if (isLast) {
    document.getElementById('dynamic-form').requestSubmit();
  } else {
    e.preventDefault();
    goToStep(currentStep + 1);
  }
});

loadSchema();
flushPending();
</script>
</body>
</html>
